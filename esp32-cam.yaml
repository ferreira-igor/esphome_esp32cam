substitutions:
  DEVICE_NAME: esp32-cam
  # Pinout: https://randomnerdtutorials.com/esp32-cam-ai-thinker-pinout/

esphome:
  name: ${DEVICE_NAME}
  friendly_name: "ESP32 CAM"

esp32:
  board: esp32cam
  framework:
    type: arduino

logger:

wifi:
  id: sensor_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${DEVICE_NAME}

captive_portal:

ota:
  - platform: esphome
    password: !secret ota_key

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

web_server:
  ota: False
  log: False

status_led:
  pin:
    number: GPIO33
    inverted: true

i2c:
  - id: camera_i2c
    sda: GPIO26
    scl: GPIO27
    scan: true

psram:

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"

  - platform: uptime
    name: "Uptime"

  - platform: internal_temperature
    name: "Internal Temperature"

esp32_camera:
  name: "Camera Feed"
  external_clock:
    pin: GPIO0
  i2c_id: camera_i2c
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32

esp32_camera_web_server:
  - port: 8080
    mode: stream

output:
  - platform: ledc
    pin: GPIO4
    channel: 2
    id: camera_flash

light:
  - platform: monochromatic
    output: camera_flash
    name: "Flashlight"
